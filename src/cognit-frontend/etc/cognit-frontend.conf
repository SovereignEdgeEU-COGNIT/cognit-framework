---
# address where the server will run
host: 0.0.0.0
# port to bind the application to
port: 1338
# opennebula XMLRPC API endpoint
one_xmlrpc: https://cognit-lab.sovereignedge.eu/RPC2
# where the AI orchestrator API is
ai_orchestrator_endpoint: http://localhost:4567
# Default Cluster ID returned when ai_orchestrator is not available
default_cluster: 0
# uvicorn logging level
log_level: info

# SQLite database for device-cluster assignment cache
db_path: /root/devices_local_database/device_cluster_assignment.db
# Number of days to keep old device assignments
db_cleanup_days: 30

# OpenNebula MySQL database (for monitoring data)
# WARNING: Change these values to match your OpenNebula database configuration
one_db_host: localhost
one_db_port: 3306
one_db_database: opennebula
one_db_user: oneadmin
one_db_password: CHANGE_ME

# Estimated load daemon: how often to recalculate (seconds)
estimated_load_update_interval_seconds: 30
