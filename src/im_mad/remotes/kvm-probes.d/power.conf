# Power monitoring configuration
# This file configures the Scaphandre-based power consumption monitoring
# for OpenNebula hosts and VMs.
#
# The monitoring probe executes the scaphandre binary directly with the
# JSON exporter to collect power metrics on-demand.
#
# Prerequisites:
#   - Scaphandre binary installed on the host
#   - Intel RAPL or AMD PowerCap kernel support enabled
#   - Appropriate permissions for oneadmin user (see :require_sudo)

# Scaphandre binary configuration
:binary:
  # Path to the scaphandre binary
  :path: '/usr/bin/scaphandre'

  # Measurement duration in seconds
  :timeout: 4

  # Maximum number of top consumers to report
  :max_consumers: 50

  # Regex to filter processes (matches OpenNebula VM processes: qemu-kvm-one-<id>)
  :process_regex: 'qemu-kvm-one-\\d+'

  # Set to true if scaphandre requires sudo to access power metrics
  # If true, ensure oneadmin has NOPASSWD sudo access to scaphandre:
  #   echo "oneadmin ALL=(root) NOPASSWD: /usr/bin/scaphandre" >> /etc/sudoers.d/opennebula
  :require_sudo: true

# Enable/disable power metrics collection
:metrics:
  # Enable VM power consumption monitoring
  :vm: false

  # Enable host power consumption monitoring
  :host: false
