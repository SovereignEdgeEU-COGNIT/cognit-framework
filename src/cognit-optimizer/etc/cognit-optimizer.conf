---
# Database (shared with cognit-frontend)
db_path: /var/lib/one/cognit/device_cluster_assignment.db
db_cleanup_days: 30

# Path to cognit-frontend source (for db_manager and opennebula imports)
cognit_frontend_src: /usr/lib/one/cognit-frontend/src

# OpenNebula API authentication
one_xmlrpc: http://localhost:2633/RPC2
one_auth_user: oneadmin
one_auth_password: opennebula

# Optimizer settings
optimizer_update_interval_seconds: 300
optimizer_enabled: true
log_level: info
