---
# Logging
log_level: info

# Database (shared with cognit-frontend and cognit-optimizer)
db_path: /var/lib/one/cognit/device_cluster_assignment.db
db_cleanup_days: 30

# OpenNebula XML-RPC endpoint
one_xmlrpc: http://localhost:2633/RPC2

one_flow_endpoint: http://localhost:2474

# OpenNebula MySQL database (for monitoring data)
one_db_host: localhost
one_db_port: 3306
one_db_database: opennebula
one_db_user: oneadmin
one_db_password: opennebula

# OpenNebula API credentials (for OneFlow REST API)
one_api_user: oneadmin
one_api_password: opennebula

# Daemon settings
estimated_load_update_interval_seconds: 30

# CPU time series storage
cpu_timeseries_db_dir: /var/lib/one/cognit/cpu_forecast/
forecast_horizon_seconds: 60
